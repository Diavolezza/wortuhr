# Xcode project for the Wortuhr app and widget (iPhone, iPad, Mac).
# Generate with: xcodegen generate   (or ./build.sh)
name: Wortuhr
options:
  bundleIdPrefix: de.wanner-it
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    DEVELOPMENT_TEAM: H2TPCP2Q8W   # paid developer account (Gerhard Wanner)
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "4"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    # Defaults of new Xcode projects: strings from Swift code go into the string catalog
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ENABLE_HARDENED_RUNTIME[sdk=macosx*]: YES
targets:
  Wortuhr:
    type: application
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - Wortuhr
      - Common
      - ../Shared
    dependencies:
      - target: WortuhrWidget
    info:
      path: Wortuhr/Info.plist
      properties:
        CFBundleDisplayName: Wortuhr
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # System texts (menus, buttons) in the user's language; the app's own texts follow the clock language
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, de, fr, it, es]
        CFBundleAllowMixedLocalizations: true
        LSApplicationCategoryType: public.app-category.utilities
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: ""
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_NAME: Wortuhr
        PRODUCT_BUNDLE_IDENTIFIER: de.wanner-it.wordclock
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: Wortuhr/Wortuhr.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=iphone*]: Wortuhr/Wortuhr-iOS.entitlements
    scheme: {}
  WortuhrWidget:
    type: app-extension
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - WortuhrWidget
      - Common
      - ../Shared
    info:
      path: WortuhrWidget/Info.plist
      properties:
        CFBundleDisplayName: Wortuhr
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, de, fr, it, es]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: WortuhrWidget
        PRODUCT_BUNDLE_IDENTIFIER: de.wanner-it.wordclock.widget
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: WortuhrWidget/WortuhrWidget.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=iphone*]: WortuhrWidget/WortuhrWidget-iOS.entitlements
        SKIP_INSTALL: YES
