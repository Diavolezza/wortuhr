# Builds a universal Wortuhr.saver for a version tag (e.g. v1.1) and attaches it to a GitHub release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check grids and time phrases
        run: node prototype/check.mjs
      - name: Import Developer ID certificate
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PW=$(uuidgen)
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          echo "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          printf '%s\n' "$NOTARY_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
      - name: Build, sign and notarise (Apple Silicon + Intel)
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey.p8" ./build.sh --no-install --notarize --version "${GITHUB_REF_NAME#v}"
          ditto -c -k --keepParent build/Wortuhr.saver "Wortuhr-${GITHUB_REF_NAME#v}.zip"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cat > notes.md <<'EOF'
          ## Install

          1. Unzip and double-click `Wortuhr.saver`. macOS asks whether to install it for you or for all users.
          2. System Settings → Screen Saver → select “Wortuhr”.

          The screen saver is signed with a Developer ID and notarised by Apple.

          Runs on Apple Silicon and Intel, macOS 13 or later.
          EOF
          gh release create "$GITHUB_REF_NAME" "Wortuhr-$VERSION.zip" --title "Wortuhr $VERSION" --notes-file notes.md
      - name: Clean up signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"
